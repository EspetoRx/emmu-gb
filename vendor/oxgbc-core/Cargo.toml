# Core oxGBC vendorado (somente os fontes de `crates/core`) para o emmu-gb.
# O nome do pacote é único no workspace (o emmu-gbc vendors uma cópia própria);
# o código em `src/` permanece idêntico ao upstream.
[package]
name = "oxgbc-core-gb"
version = "0.1.0"
edition = "2021"
authors = ["troidem <mxmgorin@gmail.com>"]
description = "Game Boy / Game Boy Color core vendored from oxGBC"
license = "GPL-3.0-only"

# Declarados apenas para manter os `#[cfg(feature = ...)]` do upstream sem
# avisos do check-cfg. Não são ativados pelo Emmu.
[features]
default = []
debug = []
lazy-flags = []
apu-trace = []
test-bus = []
per-tick-clock = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
crc = "3.4.0"
log = "0.4.27"
# Drop-in `Instant`/`SystemTime` que também funciona em wasm32.
web-time = "1.1"
