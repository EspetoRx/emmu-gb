[package]
name = "emmu-gb"
version = "0.1.0"
edition = "2024"
description = "Emmu Game Boy (DMG) core"
repository = "https://github.com/EspetoRx/emmu-gb"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

# O núcleo de emulação (oxGBC, configurado em modo DMG) é vendorizado dentro
# desta pasta, em `vendor/oxgbc-core`. Nenhum pacote de emulação fica fora do
# diretório do módulo.
[dependencies]
oxgbc-core = { package = "oxgbc-core-gb", path = "vendor/oxgbc-core" }
serde_json = "1"
wasm-bindgen = "0.2"
